name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ge_linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install Packages
        run: pip install ruff

      - name: Lint Files
        run: ruff check .

  hw_linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install Packages
        run: pip install ruff

      - name: Lint Files
        run: |
          declare -A MEMBERS=(
            ["YinceIuCode"]="1"
            ["doomsdaycome"]="2"
            ["NghiaTran2504"]="3"
            ["tl7243"]="4"
            ["Dunghun111"]="5"
            ["Hoang13707"]="6"
            ["TuanPham007"]="7"
          )
          is_fail=0
          for member in "${!MEMBERS[@]}"; do
            if ruff check "./members/$member" --quiet; then
              printf "%-20s PASS\n" "$member:"
            else
              printf "%-20s FAIL\n" "$member:"
              is_fail=1
            fi
          done
          if [ $is_fail -eq 1 ]; then
            exit 1
          fi

  hw_w1_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install Packages
        run: pip install pytest

      - name: Test Modules
        run: |
          declare -A MEMBERS=(
            ["YinceIuCode"]="1"
            ["doomsdaycome"]="2"
            ["NghiaTran2504"]="3"
            ["tl7243"]="4"
          )
          is_fail=0
          for member in "${!MEMBERS[@]}"; do
            if pytest -q ./tests/test_w1.py --member "$member" --variant "${MEMBERS[$member]}" > /dev/null 2>&1; then
              printf "%-20s PASS\n" "$member:"
            else
              printf "%-20s FAIL\n" "$member:"
              is_fail=1
            fi
          done
          if [ $is_fail -eq 1 ]; then
            exit 1
          fi

  hw_w2_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install Packages
        run: pip install pytest

      - name: Test Modules
        run: |
          declare -A MEMBERS=(
            ["YinceIuCode"]="1"
            ["doomsdaycome"]="2"
            ["NghiaTran2504"]="3"
            ["tl7243"]="4"
            ["Dunghun111"]="5"
            ["Hoang13707"]="6"
            ["TuanPham007"]="7"
          )
          is_fail=0
          for member in "${!MEMBERS[@]}"; do
            if pytest -q ./tests/test_w2.py --member "$member" > /dev/null 2>&1; then
              printf "%-20s PASS\n" "$member:"
            else
              printf "%-20s FAIL\n" "$member:"
              is_fail=1
            fi
          done
          if [ $is_fail -eq 1 ]; then
            exit 1
          fi
