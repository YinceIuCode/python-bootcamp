        uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install Packages
        run: pip install pytest

      - name: Test Modules
        run: |
          declare -A MEMBERS=(
            ["YinceIuCode"]="1"
            ["doomsdaycome"]="2"
            ["NghiaTran2504"]="3"
            ["tl7243"]="4"
            ["Dunghun111"]="5"
            ["Hoang13707"]="6"
            ["TuanPham007"]="7"
          )
          is_fail=0
          for member in "${!MEMBERS[@]}"; do
            if pytest -q ./tests/test_w3.py --member "$member" > /dev/null 2>&1; then
              printf "%-15s PASSED\n" "$member:"
