  t_hw_w2_testing:
    name: Team Homework W2 Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}

      - name: Install Packages
        run: pip install pytest

      - name: Test Modules
        run: |
          declare -A MODULES=(
            ["parse"]="1"
            ["prioritise"]="2"
            ["allocate"]="3"
            ["render"]="4"
          )
          is_fail=0
          for module in "${!MODULES[@]}"; do
            if pytest -q ./tests/test_"$module".py > /dev/null 2>&1; then
              printf "%-15s PASSED\n" "$module:"
            else
              printf "%-15s FAILED\n" "$module:"
              is_fail=1
